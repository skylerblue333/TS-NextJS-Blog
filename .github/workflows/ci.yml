name: content-api-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build image
        run: docker build -t sky-content-api:ci .
      - name: Verify non-root image
        run: |
          user="$(docker image inspect sky-content-api:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
      - name: Smoke test health
        run: |
          docker run -d --rm --name sky-content-api-ci -p 13000:3000 sky-content-api:ci
          trap 'docker stop sky-content-api-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:13000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sky-content-api-ci
          exit 1
